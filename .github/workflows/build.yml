name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project zip
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 3 -name "*.zip" -not -path "./.git/*" -not -path "./_src/*" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "::error::Tidak ada file .zip di repo. Upload FreeVideoEditor.zip ke root repo."
            exit 1
          fi
          echo "Memakai: $ZIP"
          mkdir -p _src
          unzip -q "$ZIP" -d _src
          SETTINGS=$(find _src -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle.kts tidak ditemukan di dalam zip."
            exit 1
          fi
          PROJ=$(dirname "$SETTINGS")
          echo "Project dir: $PROJ"
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJ"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeVideoEditor-debug-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
